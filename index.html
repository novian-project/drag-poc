<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Victim Dashboard - Secure Session</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f9ff; padding: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #bae6fd; }
        #dropZone {
            width: 100%; height: 200px; border: 4px dashed #3b82f6;
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            color: #3b82f6; font-size: 1.2rem; font-weight: 600;
            transition: all 0.3s ease; background: #f8fafc;
        }
        #dropZone.dragover { background: #dbeafe; border-color: #2563eb; transform: scale(1.01); }
        .origin-tag { display: inline-block; background: #3b82f6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="origin-tag">Origin: <span id="domainDisplay"></span></div>
        <h1>User Dashboard</h1>
        <p>This is a secure area. Cookies are simulated for this session.</p>

        <div id="dropZone">
            Drop content here to process
        </div>
    </div>

    <script>
        // Tampilkan domain saat ini
        document.getElementById('domainDisplay').innerText = window.location.origin;

        // SIMULASI COOKIE SENSITIF
        // Dalam dunia nyata, ini adalah session token atau data login user
        document.cookie = "session_token=ABC123XYZ999; path=/; SameSite=Lax";
        document.cookie = "user_privilege=admin; path=/; SameSite=Lax";
        document.cookie = "secret_data=TopSecretValue123; path=/; SameSite=Lax";

        const zone = document.getElementById('dropZone');

        zone.addEventListener('dragover', (e) => {
            e.preventDefault(); // Wajib agar bisa menerima drop
            zone.classList.add('dragover');
        });

        zone.addEventListener('dragleave', () => {
            zone.classList.remove('dragover');
        });

        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('dragover');
            
            const data = e.dataTransfer.getData('text/plain');
            console.log("Data received from cross-origin: ", data);

            // SIMULASI KERENTANAN:
            // Aplikasi mencoba menavigasi berdasarkan data yang di-drop
            if (data.startsWith('javascript:')) {
                // Browser seharusnya memblokir ini, tapi fitur Split-View/Multi-Window 
                // terkadang meloloskan konteks navigasi ini.
                window.location.href = data;
            }
        });
    </script>
</body>
</html>
