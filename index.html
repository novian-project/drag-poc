<!DOCTYPE html>
<html>
<head>
    <title>PoC Victim - Secure Domain</title>
    <style>
        body { font-family: sans-serif; background: #f0f9ff; padding: 20px; }
        .origin-box { background: #e0f2fe; padding: 15px; border-radius: 8px; border: 1px solid #3b82f6; margin-bottom: 20px; }
        #dropZone {
            width: 100%; height: 250px; background: #fff;
            border: 4px dashed #3b82f6; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #3b82f6; font-size: 1.2em;
        }
        .status { color: #059669; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="origin-box">
        <strong>Victim Origin:</strong> <span id="originText"></span><br>
        <div class="status">✅ Session Active (Simulated Cookies Loaded)</div>
    </div>

    <div id="dropZone">
        DROP ATTACKER PAYLOAD HERE
    </div>

    <script>
        // 1. Tampilkan Origin otomatis
        document.getElementById('originText').innerText = window.location.origin;

        // 2. Pasang Cookie Otomatis untuk simulasi (Hanya di sisi Victim)
        // Ini mensimulasikan user yang sudah login di situs ini
        document.cookie = "session_id=SECRET_TOKEN_987654321; path=/";
        document.cookie = "user_auth=authenticated_victim_user; path=/";
        document.cookie = "account_type=premium_admin; path=/";

        console.log("Simulated cookies have been set.");

        // 3. Listener untuk visualisasi drop (Opsional, karena alert akan dipicu oleh payload Attacker)
        const zone = document.getElementById('dropZone');
        zone.addEventListener('dragover', (e) => e.preventDefault());
        zone.addEventListener('drop', (e) => {
            // Kita tidak perlu e.preventDefault() jika ingin memicu navigasi javascript:
            console.log("Item dropped into zone.");
        });
    </script>
</body>
</html>
